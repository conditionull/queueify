<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Queueify Admin</title>
<link rel="stylesheet" href="docus.css">
<script src="docus.js"></script>
<style>
  /* The page's own names for things, pointed at the docs site's palette in
     docus.css - light and dark both come from there. */
  :root {
    --bg: var(--ui-bg);
    --surface: var(--ui-bg);
    --surface-2: var(--ui-bg-elevated);
    --line: var(--ui-border-muted);
    --line-soft: var(--ui-border);
    --text: var(--ui-text);
    --muted: var(--ui-text-muted);
    --faint: var(--ui-text-dimmed);
    --accent: var(--ui-primary-strong);
    --accent-soft: color-mix(in srgb, var(--ui-primary) 18%, transparent);
    --green: var(--ui-primary-strong);
    --amber: var(--ui-warning-text);
    --red: var(--ui-error);
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--ui-primary); text-decoration: none; font-weight: 500; }
  a:hover { text-decoration: underline; }

  /* ------------------------------------------------------------ layout */

  .inner { max-width: 1020px; }

  /* The sections stay under the header while the page scrolls, so moving
     between them never means going back to the top. The fade underneath lets
     a card pass behind them without a hard edge. */
  .pillbar {
    position: sticky; top: 64px; z-index: 10;
    display: flex; justify-content: flex-start;
    /* The top padding is solid page, so once stuck the tabs sit a little
       below the header instead of against its border. The margin takes the
       same amount back, so nothing moves before you scroll. */
    padding: 14px 0 20px; margin-top: -22px;
    background: linear-gradient(var(--bg) 75%, transparent);
  }
  .pills { display: flex; }

  /* Each tab's page opens the way a docs page does */
  .page-head {
    padding-bottom: 28px; margin-bottom: 28px;
    border-bottom: 1px solid var(--line-soft);
  }
  .page-head::before {
    content: 'Admin panel'; display: block; margin-bottom: 8px;
    font-size: 14px; font-weight: 600; color: var(--ui-primary);
  }
  .page-head h1 {
    margin: 0; font-size: 36px; line-height: 1.2; font-weight: 700;
    letter-spacing: -.01em; color: var(--ui-text-highlighted);
  }
  .page-head p { margin: 14px 0 0; color: var(--muted); font-size: 18px; line-height: 1.55; max-width: 62ch; }

  /* ------------------------------------------------------------- cards */

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .card > header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line-soft);
    display: flex; align-items: baseline; gap: 10px;
  }
  .card > header h2 { margin: 0; font-size: 16px; font-weight: 600; color: var(--ui-text-highlighted); }
  .card > header .sub { color: var(--faint); font-size: 13px; }
  .card .body { padding: 6px 18px 16px; }

  .row {
    display: grid; grid-template-columns: minmax(0, 1fr) 236px;
    gap: 18px; align-items: center;
    padding: 14px 0; border-bottom: 1px solid var(--line-soft);
  }
  .row:last-child { border-bottom: 0; }
  .row .name { font-size: 14px; font-weight: 500; color: var(--ui-text-highlighted); }
  .row .why { display: block; margin-top: 3px; color: var(--faint); font-size: 13px; font-weight: 400; }
  .row .control { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  /* The text field is the one thing here that should give up room when the
     buttons beside it need it. */
  .row .control input[type="text"] { min-width: 0; flex: 1 1 auto; }
  .row .unit { color: var(--faint); font-size: 12.5px; }

  input[type="text"], input[type="number"], input[type="password"], textarea, select {
    font: inherit; font-size: 14px;
    color: var(--ui-text-highlighted); background: var(--bg);
    border: 1px solid var(--ui-border-accented); border-radius: 6px;
    padding: 8px 10px; width: 100%;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--ui-primary);
    box-shadow: 0 0 0 1px var(--ui-primary);
  }
  textarea { resize: vertical; min-height: 62px; line-height: 1.5; }
  /* The browser's own up/down arrows are cramped and out of place next to
     everything else here, so a number gets steppers of its own instead. */
  input[type="number"] {
    width: 84px; text-align: center;
    border-radius: 0; border-left: 0; border-right: 0;
    -moz-appearance: textfield; appearance: textfield;
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .stepper { display: flex; align-items: stretch; }
  .stepper button {
    flex: none; width: 30px; padding: 0;
    background: var(--bg); color: var(--faint);
    border: 1px solid var(--ui-border-accented); border-radius: 0;
    font-size: 15px; font-weight: 600; line-height: 1; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .stepper button:first-child { border-radius: 6px 0 0 6px; border-right: 0; }
  .stepper button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
  .stepper button:hover { background: var(--surface-2); color: var(--ui-text-highlighted); }
  .stepper:focus-within > * { border-color: var(--ui-primary); }
  .stepper:focus-within { border-radius: 6px; box-shadow: 0 0 0 1px var(--ui-primary); }
  .stepper input:focus { box-shadow: none; }

  /* A switch, rather than a stray tickbox. */
  .toggle {
    position: relative; width: 40px; height: 22px; flex: none;
    background: var(--ui-bg-accented); border: 1px solid transparent; border-radius: 999px;
    cursor: pointer; transition: background .18s, border-color .18s;
  }
  .toggle::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25);
    transition: transform .18s, background .18s;
  }
  .toggle[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
  .toggle[aria-checked="true"]::after { transform: translateX(18px); }
  .toggle:focus-visible { outline: 2px solid var(--ui-primary); outline-offset: 2px; }

  button.btn {
    font: inherit; font-size: 14px; font-weight: 500; line-height: 20px;
    border-radius: 6px; padding: 6px 12px; cursor: pointer;
    background: var(--accent); color: var(--ui-on-primary); border: 1px solid transparent;
    transition: background .15s, opacity .15s;
    /* The control column is a fixed width and these sit in a row of three:
       without this a two-word label breaks across lines and the row grows. */
    white-space: nowrap; flex: none;
  }
  button.btn:hover:not(:disabled) { background: var(--ui-primary); }
  button.btn:focus-visible { outline: 2px solid var(--ui-primary); outline-offset: 2px; }
  button.btn:disabled { opacity: .5; cursor: default; }
  button.btn.ghost { background: var(--surface-2); color: var(--text); }
  button.btn.ghost:hover:not(:disabled) { background: var(--ui-bg-accented); }
  button.btn.small { padding: 5px 10px; font-size: 12.5px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 4px 2px 8px;
    font-size: 13px; font-family: var(--font-mono); color: var(--ui-text-highlighted);
  }
  .chip button {
    background: none; border: 0; color: var(--faint); cursor: pointer;
    font-size: 14px; line-height: 1; padding: 0 2px;
  }
  .chip button:hover { color: var(--red); }

  .tag {
    font-size: 12px; font-weight: 500;
    padding: 1px 7px; border-radius: 6px;
    background: var(--surface-2); color: var(--faint);
  }
  .tag.edited { background: color-mix(in srgb, var(--ui-warning) 12%, transparent); color: var(--amber); }

  .mono { font-family: var(--font-mono); font-size: 13px; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }

  /* --------------------------------------------------------- save bar */

  .savebar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: center; gap: 14px;
    padding: 12px max(32px, calc((100vw - 1440px) / 2 + 32px));
    background: var(--ui-header-bg);
    border-top: 1px solid var(--line-soft);
    backdrop-filter: blur(8px);
    transform: translateY(105%); transition: transform .22s ease;
  }
  .savebar.show { transform: translateY(0); }
  .savebar .status { flex: 1; font-size: 13px; color: var(--muted); }
  .savebar .status.error { color: var(--ui-error-text); }

  /* --------------------------------------------------- cooldown dialog */

  dialog.cooldowns {
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface); color: var(--text);
    padding: 0; width: min(420px, calc(100vw - 32px));
  }
  dialog.cooldowns::backdrop { background: var(--ui-scrim); }
  dialog.cooldowns header { padding: 16px 20px; border-bottom: 1px solid var(--line-soft); }
  dialog.cooldowns h3 { margin: 0 0 4px; font-size: 15px; font-weight: 650; }
  dialog.cooldowns header p { margin: 0; color: var(--faint); font-size: 12.5px; }
  dialog.cooldowns .pair { display: flex; gap: 14px; padding: 18px 20px; }
  dialog.cooldowns .field { flex: 1; min-width: 0; }
  dialog.cooldowns .field label {
    display: block; margin-bottom: 7px;
    font-size: 13px; font-weight: 600;
  }
  dialog.cooldowns .field .with-unit { display: flex; align-items: center; gap: 7px; }
  dialog.cooldowns .field input { width: 100%; }
  dialog.cooldowns .hint { padding: 0 20px 4px; margin: 0; color: var(--faint); font-size: 12.5px; }
  dialog.cooldowns footer {
    display: flex; justify-content: flex-end; gap: 9px;
    padding: 14px 20px; border-top: 1px solid var(--line-soft);
  }

  .toast {
    position: fixed; right: 22px; bottom: 84px; z-index: 30;
    background: var(--surface-2); border: 1px solid var(--line);
    border-left: 3px solid var(--green);
    border-radius: 6px; padding: 11px 14px; font-size: 13px;
    box-shadow: var(--ui-shadow);
    max-width: 340px;
  }
  .toast.bad { border-left-color: var(--red); }

  .search { margin-bottom: 14px; }
  .empty { padding: 20px 0; color: var(--faint); font-size: 13px; }

  @media (max-width: 860px) {
    .savebar { padding: 12px 16px; }
    .pillbar { position: static; margin-top: 0; }
    .pills { width: 100%; overflow-x: auto; }
    .pills button { flex: 1; }
    .page-head h1 { font-size: 30px; }
    .page-head p { font-size: 16px; }
    .row { grid-template-columns: 1fr; }
    .row .control { justify-content: flex-start; }
  }

  /* ------------------------------------------------------------- frame */

  /* The page sits in the frame from docus.css. Its title rule runs out to the
     rails, and the panels under it do too, one straight after another, so the
     page reads as one ruled table under its title instead of cards floating
     in the middle. Each panel's text keeps the page's gutter, so it lines up
     with the title above it. */
  .inner { max-width: none; }
  .page-head {
    margin: 0 calc(-1 * var(--d-gutter));
    padding-inline: var(--d-gutter);
    border-bottom-color: var(--line);
  }
  .view > .card, #view > .card {
    margin: 0 calc(-1 * var(--d-gutter));
    border-width: 0 0 1px; border-radius: 0;
  }
  .card > header { padding-inline: var(--d-gutter); background: color-mix(in srgb, var(--ui-bg-elevated) 35%, transparent); }
  .card .body { padding-inline: var(--d-gutter); }

  /* ---------------------------------------------------- viewer rewards */

  .fx-stage { position: relative; height: 150px; margin: 14px 0 4px; }
  .fx-stage .fx-widget {
    position: absolute; inset: 0; border-radius: 14px; overflow: hidden;
    background: linear-gradient(135deg, #1c2150, #0e1024); color: #fff;
  }
  .fx-widget .fx-art {
    position: absolute; left: 14px; top: 14px; bottom: 14px; aspect-ratio: 1; border-radius: 10px;
    background: linear-gradient(135deg, #8c9bff, #3b5bdb); box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
  }
  .fx-widget .fx-title { position: absolute; left: 150px; top: 38px; font-size: 20px; font-weight: 700; }
  .fx-widget .fx-artist { position: absolute; left: 150px; top: 68px; font-size: 14px; color: rgba(255, 255, 255, .65); }
  .fx-widget .fx-bar {
    position: absolute; left: 150px; right: 24px; bottom: 30px; height: 6px; border-radius: 3px;
    background: linear-gradient(90deg, #7b8cff 45%, rgba(255, 255, 255, .15) 45%);
  }
  .fx-groups, .fx-allowed { display: grid; gap: 10px; padding: 12px 0 8px; }
  .fx-group { display: grid; grid-template-columns: 130px 1fr; gap: 10px; align-items: start; }
  .fx-group-label { padding-top: 6px; font-size: 12px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }
  .fx-group-label.style-group { margin: 14px 0 2px; padding: 0; }
  .fx-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
  @media (max-width: 640px) { .fx-group { grid-template-columns: 1fr; gap: 4px; } }
  .fx-pick {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2);
    color: var(--text); font: inherit; font-size: 13px; cursor: pointer;
  }
  .fx-pick:hover { border-color: var(--ui-border-accented); color: var(--ui-text-highlighted); }
  .fx-pick[aria-pressed="true"] {
    border-color: var(--accent); color: var(--ui-text-highlighted);
    background: color-mix(in srgb, var(--accent) 16%, transparent);
  }
  .fx-pick.fx-milestone { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  details.card.fold > summary {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; cursor: pointer; list-style: none;
    padding: 16px var(--d-gutter, 18px); background: color-mix(in srgb, var(--ui-bg-elevated) 35%, transparent);
  }
  details.card.fold > summary::-webkit-details-marker { display: none; }
  details.card.fold > summary::before { content: '›'; color: var(--faint); transition: rotate .15s; display: inline-block; }
  details.card.fold[open] > summary::before { rotate: 90deg; }
  details.card.fold > summary h2 { margin: 0; font-size: 16px; font-weight: 600; color: var(--ui-text-highlighted); }
  details.card.fold > summary .sub { color: var(--faint); font-size: 13px; }
  .sub-defaults { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .sub-default { display: grid; gap: 6px; }
  .sub-tier { font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .sub-default-controls { display: flex; gap: 6px; }
  .sub-default-controls select { flex: 1; min-width: 0; }
  @media (max-width: 760px) { .sub-defaults { grid-template-columns: 1fr; } }
  .access-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 10px 0 2px; }
  .access-tally { margin: 0; font-size: 12.5px; }
  .access-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .access-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px;
    border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; background: var(--surface-2);
  }
  /* The left edge says who can pick it at a glance: green for every sub,
     amber for a higher tier, grey for nobody. */
  .access-item[data-level="2"], .access-item[data-level="3"] { border-left-color: var(--ui-warning, #f59e0b); }
  .access-item[data-level="0"] { border-left-color: var(--line); opacity: .7; }
  .access-name { flex: 1; min-width: 0; padding: 0; border: 0; background: none; color: var(--ui-text-highlighted); font: inherit; font-size: 13.5px; text-align: left; cursor: pointer; }
  .access-name:hover { color: var(--accent); }
  .access-item select { width: auto; padding-top: 5px; padding-bottom: 5px; font-size: 12.5px; }
  .fold-subhead { margin: 22px 0 4px; font-size: 14px; font-weight: 600; color: var(--ui-text-highlighted); }
  .style-row {
    display: grid; grid-template-columns: 96px 110px repeat(3, minmax(90px, 1fr)) auto auto; gap: 10px; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--line-soft);
  }
  .style-row:last-child { border-bottom: 0; }
  .style-row .style-name { font-size: 14px; font-weight: 500; color: var(--ui-text-highlighted); }
  .style-row .remove { background: none; border: 0; color: var(--faint); font-size: 16px; cursor: pointer; padding: 0 4px; }
  .style-row .remove:hover { color: var(--ui-text-highlighted); }
  .style-knob { display: grid; gap: 2px; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .style-knob input { width: 100%; accent-color: var(--accent); }
  @media (max-width: 900px) {
    .style-row { grid-template-columns: 1fr 1fr; }
  }
  .tier-row {
    display: grid; grid-template-columns: minmax(90px, 1fr) auto auto auto auto; gap: 8px; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--line-soft);
  }
  .tier-row .unit { color: var(--faint); font-size: 12.5px; }
  .tier-row .remove { background: none; border: 0; color: var(--faint); font-size: 18px; cursor: pointer; padding: 0 4px; }
  .tier-row .remove:hover { color: var(--red); }
  @media (max-width: 640px) {
    .tier-row { grid-template-columns: 1fr auto; }
  }

</style>
<!-- Loaded before the page script: number fields are built during the
     first render, and they ask for holdRepeat as they are made. -->
<script src="stepper.js"></script>
<!-- The widget's own effects, for the Viewer rewards tab's previews. -->
<script src="effects.js"></script>
</head>
<body>

<q-header></q-header>
<div class="d-shell">
  <aside class="d-aside">
    <q-nav active="admin"></q-nav>
    <div class="d-aside-foot">Changes apply while the bot runs.</div>
  </aside>

  <main class="d-main">
    <div class="inner">
      <div class="pillbar">
        <nav class="pills d-tabs">
          <button class="active" data-view="settings">Settings</button>
          <button data-view="aliases">Commands</button>
          <button data-view="messages">Chat messages</button>
          <button data-view="perks">Viewer rewards</button>
        </nav>
      </div>

      <div id="view"></div>
    </div>
  </main>
</div>

<div class="savebar" id="savebar">
  <span class="status" id="save-status">You have unsaved changes.</span>
  <button class="btn ghost" id="btn-discard">Discard</button>
  <button class="btn" id="btn-save">Save changes</button>
</div>

<script>
const $ = id => document.getElementById(id);

const state = {
  view: 'settings',
  loaded: {},
  draft: {},
  dirty: false
};

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, character => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]
  ));
}

async function api(path, options) {
  const res = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, options));
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || data.message || 'Request failed');
  return data;
}

let toastTimer = null;

function toast(text, bad) {
  clearTimeout(toastTimer);
  document.querySelector('.toast')?.remove();

  const element = document.createElement('div');
  element.className = 'toast' + (bad ? ' bad' : '');
  element.textContent = text;
  document.body.appendChild(element);

  toastTimer = setTimeout(() => element.remove(), bad ? 9000 : 5000);
}

/**
 * Whether there is anything to save is a question about the page, not about
 * what has been touched.
 *
 * Changing a setting and changing it back leaves nothing to save, so every
 * edit compares the whole draft with the copy taken when the page loaded.
 * Both sides go through the view's `snapshot`, which puts a draft in the form
 * the server would store it - lists sorted, text trimmed, numbers rounded - so
 * two drafts that would save the same thing compare the same.
 */
function snapshot() {
  const view = views[state.view];
  return view && view.snapshot ? JSON.stringify(view.snapshot()) : '';
}

/** Takes the draft as it is now as the saved one. Each render calls this. */
function markLoaded() {
  state.baseline = snapshot();
  setDirty(false);
}

function markChanged() {
  setDirty(snapshot() !== state.baseline);
}

function setDirty(dirty, message) {
  state.dirty = dirty;
  $('savebar').classList.toggle('show', dirty);
  $('save-status').className = 'status';
  $('save-status').textContent = message || 'You have unsaved changes.';
}

/* ------------------------------------------------------------ controls */

function toggle(checked, onChange) {
  const button = document.createElement('button');
  button.className = 'toggle';
  button.setAttribute('role', 'switch');
  button.setAttribute('aria-checked', String(Boolean(checked)));
  button.addEventListener('click', () => {
    const next = button.getAttribute('aria-checked') !== 'true';
    button.setAttribute('aria-checked', String(next));
    onChange(next);
  });
  return button;
}

function row(name, why, control) {
  const element = document.createElement('div');
  element.className = 'row';

  const label = document.createElement('div');
  label.className = 'name';
  label.innerHTML = escapeHtml(name) + (why ? '<span class="why">' + escapeHtml(why) + '</span>' : '');

  const holder = document.createElement('div');
  holder.className = 'control';
  holder.append(...(Array.isArray(control) ? control : [control]));
  // A switch shows no text of its own; the row's name is what it turns on.
  for (const each of holder.querySelectorAll('[role="switch"]:not([aria-label])')) each.setAttribute('aria-label', name);

  element.append(label, holder);
  return element;
}

function card(title, sub) {
  const element = document.createElement('section');
  element.className = 'card';

  const header = document.createElement('header');
  header.innerHTML = '<h2>' + escapeHtml(title) + '</h2>' +
    (sub ? '<span class="sub">' + escapeHtml(sub) + '</span>' : '');

  const body = document.createElement('div');
  body.className = 'body';

  element.append(header, body);
  element.body = body;
  return element;
}

function pageHead(title, description) {
  const head = document.createElement('div');
  head.className = 'page-head';

async function renderSettings() {
  const data = await api('/api/admin/settings');
  state.loaded.settings = data;
  state.draft.settings = {
    queue: { ...data.queue },
    whitelist: [...data.whitelist],
    blocklist: [...(data.blocklist || [])]
  };

  const view = $('view');
  view.innerHTML = '';
  view.appendChild(pageHead('Settings',
    'How the queue behaves, who may move the widget, and who is ignored. Everything here takes effect immediately - the same values the chat commands change.'));

  const queue = card('Queue', 'Also settable with !delay, !repeatdelay, !duration');

  for (const [key, field] of Object.entries(data.fields)) {
    const draft = state.draft.settings.queue;

    if (field.type === 'boolean') {
      queue.body.appendChild(row(field.label, '', toggle(draft[key], value => {
        draft[key] = value;
        markChanged();
      })));
      continue;
    }

    const stepper = document.createElement('div');
    stepper.className = 'stepper';

    const input = document.createElement('input');
    input.type = 'number';
    input.value = draft[key];
    input.min = field.min;
    input.max = field.max;

    const set = value => {
      const next = Math.max(field.min, Math.min(field.max, Math.round(value)));
      if (!Number.isFinite(next)) return;

      input.value = next;
      draft[key] = next;
      markChanged();
    };

    input.addEventListener('input', () => {
      draft[key] = Number(input.value);
      markChanged();
    });
    // Whatever was typed is pulled back inside the limits once they leave it.
    input.addEventListener('change', () => set(Number(input.value)));

    const nudge = (label, delta, hint) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = label;
      button.title = hint;
      button.tabIndex = -1;
      // Held down it repeats and speeds up - these run to 3600.
      holdRepeat(button, steps => set(Number(input.value) + delta * steps));
      return button;
    };

    stepper.append(nudge('−', -1, 'Less'), input, nudge('+', 1, 'More'));

    const unit = document.createElement('span');
    unit.className = 'unit';
    unit.textContent = field.unit || '';

    queue.body.appendChild(row(field.label, `${field.min}-${field.max} ${field.unit || ''}`.trim(), [stepper, unit]));
  }

  view.appendChild(queue);

  // --- whitelist and blocklist -----------------------------------------
  const whitelist = card('Widget whitelist', 'Viewers who may use !tr and !bc without being a mod');
  nameList(whitelist, 'whitelist', 'Allowed viewers', 'Mods only.');
  view.appendChild(whitelist);

  const blocklist = card('Command blocklist', 'Accounts whose commands are all ignored, mods included');
  nameList(blocklist, 'blocklist', 'Blocked accounts', 'Nobody is blocked.');
  const why = document.createElement('p');
  why.className = 'muted';
  why.style.margin = '0';
  why.textContent = "For bots that repeat chat, like a translation bot: it copies a command from somebody else's message and runs it with its own mod permissions. Every command from these accounts is ignored without a reply, song requests included, and this wins over the widget whitelist.";
  const whyRow = document.createElement('div');
  whyRow.className = 'row';
  whyRow.style.gridTemplateColumns = '1fr';
  whyRow.appendChild(why);
  blocklist.body.appendChild(whyRow);
  view.appendChild(blocklist);

  // --- read-only summary ------------------------------------------------
  const status = card('Connections', 'Changed on the setup dashboard');
  const line = (name, value, ok) => {
    const badge = document.createElement('span');
    badge.className = 'tag' + (ok ? '' : ' edited');
    badge.textContent = ok ? 'connected' : 'not set';

    const detail = document.createElement('span');
    detail.className = 'mono muted';
    detail.textContent = value;

    status.body.appendChild(row(name, '', [detail, badge]));
  };

  line('OBS', data.obs.configured ? `${data.obs.scene} / ${data.obs.source}` : '', data.obs.configured);
  line('Spotify Canvas cookie', '', data.canvas.configured);
  line('Widget', `${data.widget.width} × ${data.widget.height}`, true);

  view.appendChild(status);
  markLoaded();
}

/**
 * A list of Twitch names edited as chips: type one, Enter adds it, × removes
 * it. Both widget lists are this, over their own key in the settings draft.
 */
function nameList(target, key, label, emptyText) {
  const chips = document.createElement('div');
  chips.className = 'chips';

  const drawChips = () => {
    chips.innerHTML = '';

    if (!state.draft.settings[key].length) {
      const empty = document.createElement('span');
      empty.className = 'muted';
      empty.textContent = emptyText;
      chips.appendChild(empty);
    }

    for (const user of state.draft.settings[key]) {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = user;

      const remove = document.createElement('button');
      remove.textContent = '×';
      remove.title = 'Remove ' + user;
      remove.addEventListener('click', () => {
        state.draft.settings[key] = state.draft.settings[key].filter(name => name !== user);
        drawChips();
        markChanged();
      });

      chip.appendChild(remove);
      chips.appendChild(chip);
    }
  };

  drawChips();

  const add = document.createElement('input');
  add.type = 'text';
  add.placeholder = 'twitch username';
  add.addEventListener('keydown', event => {
    if (event.key !== 'Enter') return;
    const name = add.value.trim().toLowerCase().replace(/^@/, '');
    if (!name) return;

    if (!state.draft.settings[key].includes(name)) {
      state.draft.settings[key].push(name);
      drawChips();
      markChanged();
    }

    add.value = '';
  });

  target.body.appendChild(row(label, 'Press Enter to add', add));
  const chipRow = document.createElement('div');
  chipRow.className = 'row';
  chipRow.style.gridTemplateColumns = '1fr';
  chipRow.appendChild(chips);
  target.body.appendChild(chipRow);
}

async function saveSettings() {
  let result;

  try {
    result = await api('/api/admin/settings', {
      method: 'PUT',
      body: JSON.stringify(state.draft.settings)
    });
  } catch (err) {
    // Turning channel point requests on asks Twitch to enable the reward, and
    // Twitch can say no. Redraw from the server so the switches show what is
    // really set rather than what was asked for, then report the refusal.
    await renderSettings().catch(() => {});
    setDirty(false);
    throw err;
  }

  toast(result.changed.length || result.whitelist
    ? 'Saved. The bot is using these now.'
    : 'Nothing to change.');

/**
 * A 0-3600 second box with - and + beside it.
 *
 * The settings page builds its steppers against a field definition; this is the
 * same control for a value standing on its own, and both repeat when held.
 */
function cooldownStepper(value) {
  const wrap = document.createElement('div');
  wrap.className = 'stepper';

  const input = document.createElement('input');
  input.type = 'number';
  input.min = 0;
  input.max = 3600;
  input.step = 1;
  input.value = value;

  const set = next => {
    const clamped = Math.max(0, Math.min(3600, Math.round(Number(next))));
    input.value = Number.isFinite(clamped) ? clamped : 0;
  };

  // Held to the limits when they leave it, not while typing, so a half-typed
  // number is not snatched away mid-keystroke.
  input.addEventListener('change', () => set(input.value));

  const nudge = (label, delta, hint) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.title = hint;
    button.tabIndex = -1;
    holdRepeat(button, steps => set(Number(input.value) + delta * steps));
    return button;
  };

  wrap.append(nudge('−', -1, 'Less'), input, nudge('+', 1, 'More'));
  wrap.get = () => Math.max(0, Math.min(3600, Math.round(Number(input.value) || 0)));
  wrap.focus = () => { input.focus(); input.select(); };

  return wrap;
}

/**
 * The two waits for one command, in a dialog.
 *
 * A modal rather than two more boxes on the row: the row's controls are 236px
 * wide and already hold the alias field and a Reset, and the labels only make
 * sense written out, which there is no room for twenty-odd times over.
 *
 * Resolves to the new pair, or null if it was canceled. Nothing is saved here
 * - it edits the draft, and the savebar writes it like every other change.
 */
function editCooldowns(command, current) {
  return new Promise(resolve => {
    const dialog = document.createElement('dialog');
    dialog.className = 'cooldowns';

    dialog.innerHTML =
      '<header>' +
        '<h3>!' + escapeHtml(command.name) + '</h3>' +
        '<p>' + escapeHtml(command.summary || '') + '</p>' +
      '</header>' +
      '<div class="pair">' +
        '<div class="field"><label>Global cooldown</label>' +
          '<div class="with-unit" data-slot="global"><span class="unit">secs</span></div></div>' +
        '<div class="field"><label>Per-user cooldown</label>' +
          '<div class="with-unit" data-slot="user"><span class="unit">secs</span></div></div>' +
      '</div>' +
      '<p class="hint">Global is the whole chat, per-user is each person. 0 turns one off. ' +
        'Mods are never held up, and being turned down is silent.</p>' +
      '<footer>' +
        '<button class="btn ghost" data-act="cancel">Cancel</button>' +
        '<button class="btn" data-act="ok">Done</button>' +
      '</footer>';

    // The same stepper the settings page uses, so every number in the panel
    // has - and + and repeats when held.
    const build = which => {
      const control = cooldownStepper(current[which] ?? 0);
      const slot = dialog.querySelector(`[data-slot="${which}"]`);
      slot.insertBefore(control, slot.firstChild);
      return control;
    };

    const globalControl = build('global');
    const userControl = build('user');

    let answer = null;

    dialog.querySelector('[data-act="cancel"]').addEventListener('click', () => dialog.close());
    dialog.querySelector('[data-act="ok"]').addEventListener('click', () => {
      answer = { global: globalControl.get(), user: userControl.get() };
      dialog.close();
    });

    // Clicking the backdrop is a cancel, same as the confirm dialog.
    dialog.addEventListener('click', event => {
      if (event.target === dialog) dialog.close();
    });

    dialog.addEventListener('close', () => {
      dialog.remove();
      resolve(answer);
    });

    document.body.appendChild(dialog);
    dialog.showModal();
    globalControl.focus();
  });
}

function cooldownLabel({ global, user }) {
  if (!global && !user) return 'No wait';
  if (global && user) return `${global}s / ${user}s`;
  return global ? `${global}s chat` : `${user}s each`;
}

async function renderAliases() {
  const data = await api('/api/admin/aliases');
  state.loaded.aliases = data;
  state.draft.aliases = Object.fromEntries(data.commands.map(command => [command.name, [...command.aliases]]));
  state.draft.cooldowns = Object.fromEntries(
    data.commands.map(command => [command.name, { ...command.cooldowns }])
  );

  const view = $('view');
  view.innerHTML = '';
  view.appendChild(pageHead('Commands',
    'What chat has to type for each command. The name itself never changes - these are the extra words that also work. Saved to <span class="mono">config/aliases.json</span>.'));

  const search = document.createElement('input');
  search.type = 'text';
  search.className = 'search';
  search.placeholder = 'Filter commands';
  view.appendChild(search);

  const groups = {};
  for (const command of data.commands) {
    (groups[command.group] = groups[command.group] || []).push(command);
  }

  const cards = [];

  for (const [group, commands] of Object.entries(groups)) {
    const section = card(group);

    for (const command of commands) {
      const draft = state.draft.aliases;

      const input = document.createElement('input');
      input.type = 'text';
      input.value = draft[command.name].join(', ');
      input.placeholder = 'no aliases';
      input.spellcheck = false;
      input.addEventListener('input', () => {
        draft[command.name] = input.value.split(',').map(alias => alias.trim()).filter(Boolean);
        markChanged();
      });

      const reset = document.createElement('button');
      reset.className = 'btn ghost small';
      reset.textContent = 'Reset';
      reset.title = 'Back to ' + (command.defaults.map(alias => '!' + alias).join(', ') || 'no aliases');
      reset.addEventListener('click', () => {
        draft[command.name] = [...command.defaults];
        input.value = command.defaults.join(', ');
        markChanged();
      });

      const wait = document.createElement('button');
      wait.className = 'btn ghost small';
      wait.textContent = cooldownLabel(state.draft.cooldowns[command.name]);
      wait.title = 'How often !' + command.name + ' may be run';
      wait.addEventListener('click', async () => {
        const picked = await editCooldowns(command, state.draft.cooldowns[command.name]);
        if (!picked) return;

        state.draft.cooldowns[command.name] = picked;
        wait.textContent = cooldownLabel(picked);
        markChanged();
      });

      const element = row('!' + command.name, command.summary, [input, wait, reset]);
      element.dataset.search = (command.name + ' ' + command.summary + ' ' + command.aliases.join(' ')).toLowerCase();
      section.body.appendChild(element);
    }

    cards.push(section);
    view.appendChild(section);
  }

  search.addEventListener('input', () => {
    const term = search.value.trim().toLowerCase();

    for (const section of cards) {
      let shown = 0;

      for (const element of section.body.children) {
        const match = !term || (element.dataset.search || '').includes(term);
        element.classList.toggle('hidden', !match);
        if (match) shown++;
      }

      section.classList.toggle('hidden', shown === 0);
    }
  });

  markLoaded();
}

const SAMPLE_COLORS = { vibrant: '#7b8cff', light: '#dfe3ff', dark: '#1c2150' };
let fxStage = null;

function paletteLabel(name) {
  const known = window.QueueifyFx && QueueifyFx.PALETTES.find(palette => palette.name === name);
  return known ? known.label : name[0].toUpperCase() + name.slice(1);
}

function effectLabel(name) {
  if (name === 'none') return 'None';
  const known = window.QueueifyFx && QueueifyFx.EFFECTS.find(effect => effect.name === name);
  return known ? known.label : name[0].toUpperCase() + name.slice(1);
}

/** The effects, in the groups people pick them from. */
/**
 * Each theme has its own two switches, and themes made before rewards existed
 * have them off. When any do, a row names them, with one button to switch
 * them all on. Nothing shows once every theme has them.
 */
async function themesWithRewardsOff(holder) {
  let off;
  try {
    off = (await api('/api/admin/perks/themes')).off;
  } catch {
    return;
  }
  if (!off.length || !holder.isConnected) return;

  const names = off.map(theme => theme.label);
  const list = names.length === 1 ? names[0]
    : names.length === 2 ? names.join(' and ')
      : names.length <= 4 ? names.slice(0, -1).join(', ') + ', and ' + names[names.length - 1]
        : names.slice(0, 3).join(', ') + ', and ' + (names.length - 3) + ' more';

  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'btn ghost small';
  button.textContent = 'Turn on in every theme';

  const line = row(off.length === 1 ? '1 theme has them off' : off.length + ' themes have them off',
    list + '. Each theme has its own switches too, in the theme editor.', button);
  button.addEventListener('click', async () => {
    button.disabled = true;
    try {
      const result = await api('/api/admin/perks/themes', { method: 'POST' });
      if (result.failed.length) {
        toast('Could not change ' + result.failed.map(each => each.name).join(', ') + ': ' + result.failed[0].error, true);
        button.disabled = false;
        return;
      }
      toast(result.changed.length === 1 ? 'Rewards are on in 1 more theme.' : 'Rewards are on in ' + result.changed.length + ' more themes.');
      line.remove();
    } catch (err) {
      toast(err.message, true);
      button.disabled = false;
    }
  });
  holder.appendChild(line);
}

function effectGroups(names) {
  const fx = window.QueueifyFx;
  if (!fx) return [{ label: '', names }];
  return fx.GROUPS
    .map(group => ({ label: group.label, names: names.filter(name => fx.groupOf(name) === group.name) }))
    .filter(group => group.names.length);
}

/**
 * Plays an effect on the sample widget at the top of the page, in the style
 * set for it further down - including changes not saved yet.
 */
function tryEffect(effect, { power = 2, milestone = null } = {}) {
  if (!window.QueueifyFx || !fxStage) return;
  QueueifyFx.stop();

  const widget = fxStage.querySelector('.fx-widget');
  const style = (state.draft.perks && state.draft.perks.styles[effect]) || {};
  const play = from => {
    if (effect && effect !== 'none') {
      QueueifyFx.play(effect, { host: fxStage, from, target: widget, colors: SAMPLE_COLORS, power, style });
    }
  };

  if (milestone) {
    const shown = QueueifyFx.milestone({ number: milestone, name: 'viewer' }, {
      host: fxStage, target: widget, colors: SAMPLE_COLORS, seconds: 3.5
    });
    if (QueueifyFx.groupOf(effect) === 'widget') shown.done.then(() => play(null));
    else setTimeout(() => play(shown.origin), 160);
  } else {
    play(null);
  }

  // A button far down the page would otherwise play it out of sight.
  const box = fxStage.getBoundingClientRect();
  if (box.bottom < 0 || box.top > innerHeight) fxStage.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function effectSelect(value, onChange, { none = false } = {}) {
  const select = document.createElement('select');

  if (none) {
    const option = document.createElement('option');
    option.value = 'none';
    option.textContent = 'None';
    select.appendChild(option);
  }

  for (const group of effectGroups(state.loaded.perks.effects)) {
    const holder = group.label ? document.createElement('optgroup') : select;
    if (group.label) holder.label = group.label;
    for (const name of group.names) {
      const option = document.createElement('option');
      option.value = name;
      option.textContent = effectLabel(name);
      holder.appendChild(option);
    }
    if (holder !== select) select.appendChild(holder);
  }

  select.value = value;
  select.addEventListener('change', () => onChange(select.value));
  return select;
}

/** A whole number with - and + beside it, held down to repeat. */
function countStepper(value, max, onChange) {
  const wrap = document.createElement('div');
  wrap.className = 'stepper';

  const input = document.createElement('input');
  input.type = 'number';
  input.min = 1;
  input.max = max;
  input.value = value;

  const set = next => {
    const clamped = Math.max(1, Math.min(max, Math.round(next)));
    if (!Number.isFinite(clamped)) return;
    input.value = clamped;
    onChange(clamped);
  };

  input.addEventListener('input', () => {
    if (input.value !== '' && Number.isFinite(Number(input.value))) onChange(Math.round(Number(input.value)));
  });
  // Whatever was typed is pulled back inside the limits once they leave it.
  input.addEventListener('change', () => set(Number(input.value)));

  const nudge = (label, delta) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.tabIndex = -1;
    holdRepeat(button, steps => set(Number(input.value) + delta * steps));
    return button;
  };

  wrap.append(nudge('−', -1), input, nudge('+', 1));
  return wrap;
}

function playButton(title, perk) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'btn ghost small';
  button.textContent = 'Play';
  button.title = title;
  button.addEventListener('click', () => {
    const next = perk();
    tryEffect(next.effect, next);
  });
  return button;
}

/** A card that starts folded, for the settings most people never need. */
function foldedCard(title, sub) {
  const element = document.createElement('details');
  element.className = 'card fold';
  const summary = document.createElement('summary');
  summary.innerHTML = '<h2>' + escapeHtml(title) + '</h2>' + (sub ? '<span class="sub">' + escapeHtml(sub) + '</span>' : '');
  const body = document.createElement('div');
  body.className = 'body';
  element.append(summary, body);
  element.body = body;
  return element;
}

async function renderPerks() {
  const data = await api('/api/admin/perks');
  state.loaded.perks = data;
  state.draft.perks = structuredClone(data.perks);
  const draft = state.draft.perks;

  const view = $('view');
  view.innerHTML = '';
  view.appendChild(pageHead('Viewer rewards',
    'When a song a viewer requested starts, the widget celebrates them. The more songs they\'ve requested, the bigger it gets. ' +
    'Subs pick their own, and milestones like a 100th song take the whole widget over for a moment. It works as it comes: change only what you want.'));

  // --- on or off ---------------------------------------------------------
  // Two switches: the effects, and the milestone takeover, each on or off on
  // its own, for every theme.
  const general = card('Viewer rewards');
  general.body.appendChild(row('Reward effects', 'The effect a viewer\'s requested song starts with: for their song count, or a sub\'s own pick.',
    toggle(draft.enabled, value => { draft.enabled = value; markChanged(); })));
  general.body.appendChild(row('Milestones', 'On a viewer\'s 10th song, their 100th, and so on, the widget steps aside for a few seconds to celebrate them.',
    toggle(draft.milestonesEnabled, value => { draft.milestonesEnabled = value; markChanged(); })));
  view.appendChild(general);
  themesWithRewardsOff(general.body);

  // --- a sample widget to watch them on ---------------------------------
  const watch = card('Try them', 'On a sample widget');
  fxStage = document.createElement('div');
  fxStage.className = 'fx-stage';
  fxStage.innerHTML = '<div class="fx-widget"><div class="fx-art"></div><b class="fx-title title-wrapper">A Beautiful Word</b>' +
    '<span class="fx-artist">Evan Call</span><i class="fx-bar"></i></div>';

  const picks = document.createElement('div');
  picks.className = 'fx-groups';
  for (const group of effectGroups(data.effects)) {
    const line = document.createElement('div');
    line.className = 'fx-group';
    const label = document.createElement('span');
    label.className = 'fx-group-label';
    label.textContent = group.label;
    const buttons = document.createElement('div');
    buttons.className = 'fx-buttons';
    for (const name of group.names) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'fx-pick';
      button.textContent = effectLabel(name);
      button.addEventListener('click', () => tryEffect(name));
      buttons.appendChild(button);
    }
    line.append(label, buttons);
    picks.appendChild(line);
  }

  const milestoneLine = document.createElement('div');
  milestoneLine.className = 'fx-group';
  const milestoneLabel = document.createElement('span');
  milestoneLabel.className = 'fx-group-label';
  milestoneLabel.textContent = 'Milestones';
  const milestoneButtons = document.createElement('div');
  milestoneButtons.className = 'fx-buttons';
  const milestoneButton = document.createElement('button');
  milestoneButton.type = 'button';
  milestoneButton.className = 'fx-pick fx-milestone';
  milestoneButton.textContent = 'A 100th song';
  milestoneButton.title = 'The widget steps aside for the milestone, with the top tier\'s effect';
  milestoneButton.addEventListener('click', () => {
    const top = draft.tiers[draft.tiers.length - 1];
    tryEffect(top ? top.effect : null, { power: 3, milestone: 100 });
  });
  milestoneButtons.appendChild(milestoneButton);
  milestoneLine.append(milestoneLabel, milestoneButtons);
  picks.appendChild(milestoneLine);

  watch.body.append(fxStage, picks);
  view.appendChild(watch);

  // --- tiers -------------------------------------------------------------
  const tiers = card('Tiers', 'The effect a viewer gets once they\'ve requested this many songs');
  const tierList = document.createElement('div');
  const addTier = document.createElement('button');
  addTier.type = 'button';
  addTier.className = 'btn ghost small';
  addTier.textContent = 'Add a tier';
  addTier.style.marginTop = '12px';

  const drawTiers = () => {
    tierList.innerHTML = '';

    draft.tiers.forEach((tier, index) => {
      const line = document.createElement('div');
      line.className = 'tier-row';

      const name = document.createElement('input');
      name.type = 'text';
      name.value = tier.name;
      name.maxLength = 24;
      name.placeholder = 'Tier name';
      name.addEventListener('input', () => { tier.name = name.value; markChanged(); });

      const from = document.createElement('div');
      from.style.display = 'flex';
      from.style.alignItems = 'center';
      from.style.gap = '8px';
      const unit = document.createElement('span');
      unit.className = 'unit';
      unit.textContent = 'songs';
      from.append(countStepper(tier.at, 1000000, value => { tier.at = value; markChanged(); }), unit);

      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'remove';
      remove.textContent = '×';
      remove.title = 'Remove this tier';
      remove.addEventListener('click', () => {
        draft.tiers.splice(index, 1);
        drawTiers();
        markChanged();
      });

      line.append(
        name,
        from,
        effectSelect(tier.effect, value => { tier.effect = value; markChanged(); }, { none: true }),
        // Ranked by where they start, as the server does: the third and up
        // get the biggest version of their effect.
        playButton('Watch this tier\'s effect', () => ({ effect: tier.effect, power: Math.min(3, index + 1) })),
        remove
      );
      tierList.appendChild(line);
    });

    if (!draft.tiers.length) {
      const empty = document.createElement('p');
      empty.className = 'muted';
      empty.textContent = 'No tiers. Only subs and milestones get anything.';
      tierList.appendChild(empty);
    }

    addTier.disabled = draft.tiers.length >= 6;
  };

  addTier.addEventListener('click', () => {
    const last = draft.tiers[draft.tiers.length - 1];
    draft.tiers.push({ name: 'New tier', at: last ? last.at * 2 : 10, effect: 'sparkles' });
    drawTiers();
    markChanged();
  });

  drawTiers();
  tiers.body.append(tierList, addTier);
  view.appendChild(tiers);

  // --- subs --------------------------------------------------------------
  const subs = card('Subscribers', 'They pick their own effect in chat with !fx, from what their sub tier opens up');
  const defaults = document.createElement('div');
  defaults.className = 'sub-defaults';
  for (const tier of [1, 2, 3]) {
    const cell = document.createElement('div');
    cell.className = 'sub-default';
    const label = document.createElement('span');
    label.className = 'sub-tier';
    label.textContent = tier === 1 ? 'Tier 1 and Prime' : 'Tier ' + tier;
    const controls = document.createElement('div');
    controls.className = 'sub-default-controls';
    controls.append(
      effectSelect(draft.subDefaults[tier], value => { draft.subDefaults[tier] = value; markChanged(); }, { none: true }),
      playButton('Watch it', () => ({ effect: draft.subDefaults[tier], power: tier === 3 ? 3 : 2 }))
    );
    cell.append(label, controls);
    defaults.appendChild(cell);
  }
  subs.body.appendChild(row('Before they pick one', 'What a sub\'s songs start with until they choose. None gives them the effect for how many songs they\'ve requested instead.', []));
  const defaultsRow = document.createElement('div');
  defaultsRow.className = 'row';
  defaultsRow.style.gridTemplateColumns = '1fr';
  defaultsRow.appendChild(defaults);
  subs.body.appendChild(defaultsRow);
  view.appendChild(subs);

  // --- everything else, folded -------------------------------------------
  const more = foldedCard('More settings', 'Milestones, which effects subs can pick, and how each effect looks');

  // Milestones.
  const chips = document.createElement('div');
  chips.className = 'chips';

  const drawMilestones = () => {
    chips.innerHTML = '';
    draft.milestones.sort((a, b) => a - b);

    if (!draft.milestones.length) {
      const empty = document.createElement('span');
      empty.className = 'muted';
      empty.textContent = 'No milestones.';
      chips.appendChild(empty);
    }

    for (const number of draft.milestones) {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = number;

      const remove = document.createElement('button');
      remove.textContent = '×';
      remove.title = 'Remove ' + number;
      remove.addEventListener('click', () => {
        draft.milestones = draft.milestones.filter(value => value !== number);
        drawMilestones();
        markChanged();
      });

      chip.appendChild(remove);
      chips.appendChild(chip);
    }
  };

  const addMilestone = document.createElement('input');
  addMilestone.type = 'number';
  addMilestone.min = 1;
  addMilestone.placeholder = 'e.g. 75';
  addMilestone.style.borderRadius = '6px';
  addMilestone.style.border = '1px solid var(--ui-border-accented)';
  addMilestone.addEventListener('keydown', event => {
    if (event.key !== 'Enter') return;
    const number = Math.round(Number(addMilestone.value));
    if (Number.isFinite(number) && number > 0 && !draft.milestones.includes(number)) {
      draft.milestones.push(number);
      drawMilestones();
      markChanged();
    }
    addMilestone.value = '';
  });

  drawMilestones();
  const subhead = text => {
    const element = document.createElement('h3');
    element.className = 'fold-subhead';
    element.textContent = text;
    return element;
  };
  more.body.appendChild(subhead('Milestones'));
  more.body.appendChild(row('Add a milestone', 'The song counts that take the widget over. Press Enter to add.', addMilestone));
  const chipRow = document.createElement('div');
  chipRow.className = 'row';
  chipRow.style.gridTemplateColumns = '1fr';
  chipRow.appendChild(chips);
  more.body.appendChild(chipRow);

  // Which sub tier each effect needs, and the page they pick from.
  more.body.appendChild(subhead('What subs can pick'));
  const WHO = [[1, 'Every sub'], [2, 'Tier 2 and up'], [3, 'Tier 3 only'], [0, 'Nobody']];
  const tally = document.createElement('p');
  tally.className = 'muted access-tally';
  const drawTally = () => {
    const count = level => data.effects.filter(effect => draft.subAccess[effect] === level).length;
    tally.textContent = WHO.map(([level, label]) => `${label}: ${count(level)}`).join(' · ');
  };

  const access = document.createElement('div');
  access.className = 'fx-access';
  const selects = [];
  for (const group of effectGroups(data.effects)) {
    const label = document.createElement('p');
    label.className = 'fx-group-label style-group';
    label.textContent = group.label;
    const grid = document.createElement('div');
    grid.className = 'access-grid';
    for (const name of group.names) {
      const item = document.createElement('div');
      item.className = 'access-item';
      const watch = document.createElement('button');
      watch.type = 'button';
      watch.className = 'access-name';
      watch.textContent = effectLabel(name);
      watch.title = 'Watch it';
      watch.addEventListener('click', () => tryEffect(name));
      const select = document.createElement('select');
      for (const [level, text] of WHO) {
        const option = document.createElement('option');
        option.value = level;
        option.textContent = text;
        select.appendChild(option);
      }
      const paint = () => { select.value = draft.subAccess[name]; item.dataset.level = draft.subAccess[name]; };
      paint();
      select.addEventListener('change', () => {
        draft.subAccess[name] = Number(select.value);
        paint();
        drawTally();
        markChanged();
      });
      selects.push(paint);
      item.append(watch, select);
      grid.appendChild(item);
    }
    access.append(label, grid);
  }

  const everyone = document.createElement('button');
  everyone.type = 'button';
  everyone.className = 'btn ghost small';
  everyone.textContent = 'Open them all to every sub';
  everyone.addEventListener('click', () => {
    for (const effect of data.effects) draft.subAccess[effect] = 1;
    selects.forEach(paint => paint());
    drawTally();
    markChanged();
  });

  drawTally();
  const accessRow = document.createElement('div');
  accessRow.className = 'row';
  accessRow.style.gridTemplateColumns = '1fr';
  const accessNote = document.createElement('p');
  accessNote.className = 'muted';
  accessNote.style.margin = '0';
  accessNote.textContent = 'Which sub tier each effect needs. Only these show on the picker page, marked with the tier they need, and only these work in chat. Effects added in an update start open to every sub.';
  const accessTools = document.createElement('div');
  accessTools.className = 'access-tools';
  accessTools.append(tally, everyone);
  accessRow.append(accessNote, accessTools, access);
  more.body.appendChild(accessRow);

  const url = document.createElement('input');
  url.type = 'text';
  url.value = draft.pickerUrl;
  url.spellcheck = false;
  url.addEventListener('input', () => { draft.pickerUrl = url.value.trim(); markChanged(); });

  const open = document.createElement('a');
  open.className = 'btn ghost small';
  open.textContent = 'Open';
  open.target = '_blank';
  open.rel = 'noopener';
  open.title = 'The page a viewer gets from !fx';
  open.style.textDecoration = 'none';
  open.addEventListener('click', event => {
    // Built the way !fx builds it (services/perks.js, pickerLink).
    try {
      const link = new URL(draft.pickerUrl || data.defaults.pickerUrl);
      link.searchParams.set('c', 'fx');
      const needing = level => data.effects.filter(effect => draft.subAccess[effect] === level).join(',');
      link.searchParams.set('allow', needing(1));
      if (needing(2)) link.searchParams.set('t2', needing(2));
      if (needing(3)) link.searchParams.set('t3', needing(3));
      open.href = link.toString().replace(/%2C/g, ',');
    } catch {
      event.preventDefault();
      toast('That is not a web address.', true);
    }
  });
  more.body.appendChild(row('Picker page', 'Where !fx sends viewers. Tapping an effect there copies the command to paste in chat.', [url, open]));

  // How each effect looks.
  more.body.appendChild(subhead('How each effect looks'));
  const lookNote = document.createElement('p');
  lookNote.className = 'muted';
  lookNote.style.margin = '0 0 4px';
  lookNote.style.fontSize = '13px';
  lookNote.textContent = 'Album colors follow the song playing. A sub who picks colors with their effect, like !fx hearts gold, gets theirs instead.';
  more.body.appendChild(lookNote);

  for (const group of effectGroups(data.effects)) {
    const groupLabel = document.createElement('p');
    groupLabel.className = 'fx-group-label style-group';
    groupLabel.textContent = group.label;
    more.body.appendChild(groupLabel);

    for (const name of group.names) {
      const style = draft.styles[name];
      const line = document.createElement('div');
      line.className = 'style-row';

      const title = document.createElement('span');
      title.className = 'style-name';
      title.textContent = effectLabel(name);

      const colors = document.createElement('select');
      for (const palette of data.palettes) {
        const option = document.createElement('option');
        option.value = palette;
        option.textContent = paletteLabel(palette);
        colors.appendChild(option);
      }
      colors.value = style.colors;
      colors.title = 'Colors';
      colors.addEventListener('change', () => { style.colors = colors.value; markChanged(); tryEffect(name); });

      const knob = (key, label) => {
        const [min, max] = data.limits[key];
        const wrap = document.createElement('label');
        wrap.className = 'style-knob';
        wrap.title = label + ': how many times the usual';
        const text = document.createElement('span');
        const range = document.createElement('input');
        range.type = 'range';
        range.min = min;
        range.max = max;
        range.step = 0.05;
        range.value = style[key];
        const show = () => { text.textContent = label + ' ' + Number(style[key]).toFixed(2).replace(/\.?0+$/, '') + '×'; };
        show();
        range.addEventListener('input', () => { style[key] = Number(range.value); show(); markChanged(); });
        range.addEventListener('change', () => tryEffect(name));
        wrap.append(text, range);
        wrap.sync = () => { range.value = style[key]; show(); };
        return wrap;
      };
      const knobs = [knob('amount', 'Amount'), knob('size', 'Size'), knob('speed', 'Speed')];

      const reset = document.createElement('button');
      reset.type = 'button';
      reset.className = 'remove';
      reset.textContent = '↺';
      reset.title = 'Back to how it came';
      reset.addEventListener('click', () => {
        Object.assign(style, data.defaults.styles[name]);
        colors.value = style.colors;
        for (const each of knobs) each.sync();
        markChanged();
      });

      line.append(title, colors, ...knobs, playButton('Watch it in this style', () => ({ effect: name, power: 2 })), reset);
      more.body.appendChild(line);
    }
  }

  view.appendChild(more);
  markLoaded();
}

async function savePerks() {
  await api('/api/admin/perks', { method: 'PUT', body: JSON.stringify({ perks: state.draft.perks }) });
  toast('Saved. The next song to start plays with these.');
}

/* --------------------------------------------------------------- shell */

const sortedNames = list => [...new Set(list.map(name => String(name).trim().toLowerCase().replace(/^@/, '')))]
  .filter(Boolean).sort();

const views = {
  settings: {
    render: renderSettings,
    save: saveSettings,
    snapshot: () => {
      const { queue, whitelist, blocklist } = state.draft.settings;
      return {
        queue: Object.fromEntries(Object.entries(queue).map(([key, value]) =>
          [key, typeof value === 'number' ? Math.round(value) : value])),
        whitelist: sortedNames(whitelist),
        blocklist: sortedNames(blocklist)
      };
    }
  },
  aliases: {
    render: renderAliases,
    save: saveAliases,
    snapshot: () => ({
      aliases: Object.fromEntries(Object.entries(state.draft.aliases).map(([name, list]) =>
        [name, [...new Set(list.map(alias => alias.trim().toLowerCase().replace(/^!/, '')))].filter(Boolean).sort()])),
      cooldowns: Object.fromEntries(Object.entries(state.draft.cooldowns).map(([name, pair]) =>
        [name, { global: Math.round(Number(pair?.global) || 0), user: Math.round(Number(pair?.user) || 0) }]))
    })
  },
  perks: {
    render: renderPerks,
    save: savePerks,
    snapshot: () => {
      const { enabled, milestonesEnabled, milestones, tiers, subDefaults, subAccess, pickerUrl, styles } = state.draft.perks;
      return {
        enabled,
        milestonesEnabled,
        milestones: [...new Set(milestones)].sort((a, b) => a - b),
        tiers: [...tiers].map(tier => ({ name: String(tier.name).trim(), at: Math.round(tier.at), effect: tier.effect }))
          .sort((a, b) => a.at - b.at),
        subDefaults: { 1: subDefaults[1], 2: subDefaults[2], 3: subDefaults[3] },
        subAccess: Object.fromEntries(Object.keys(subAccess).sort().map(effect => [effect, Number(subAccess[effect])])),
        pickerUrl: String(pickerUrl).trim(),
        styles: Object.fromEntries(Object.entries(styles).map(([name, style]) => [name, {
          colors: style.colors,
          amount: Math.round(style.amount * 100) / 100,
          size: Math.round(style.size * 100) / 100,
          speed: Math.round(style.speed * 100) / 100
        }]))
      };
    }
  },
  messages: {
    render: renderMessages,
    save: saveMessages,
    snapshot: () => Object.fromEntries(Object.entries(state.draft.messages).map(([category, entries]) =>
      [category, Object.fromEntries(Object.entries(entries).map(([key, text]) => [key, String(text).trim()]))]))
  }
};

async function show(name) {
  if (state.dirty) {
    const leave = await askConfirm(
      'The changes on this page have not been saved. They will be lost.',
      { title: 'Leave without saving?', confirm: 'Discard changes', cancel: 'Stay here', danger: true }
    );
    if (!leave) return;
  }

  state.view = name;
  setDirty(false);

  for (const button of document.querySelectorAll('.pills button[data-view]')) {
    button.classList.toggle('active', button.dataset.view === name);
  }

  $('view').innerHTML = '<div class="empty">Loading…</div>';

  try {
    await views[name].render();
  } catch (err) {
    $('view').innerHTML = '<div class="empty">Could not load this page: ' + escapeHtml(err.message) + '</div>';
  }
}

for (const button of document.querySelectorAll('.pills button[data-view]')) {
  button.addEventListener('click', () => show(button.dataset.view));
}

$('btn-save').addEventListener('click', async () => {
  const button = $('btn-save');
  button.disabled = true;

  try {
    await views[state.view].save();
    setDirty(false);
    await views[state.view].render();
  } catch (err) {
    $('save-status').className = 'status error';
    $('save-status').textContent = err.message;
    toast(err.message, true);
  } finally {
    button.disabled = false;
  }
});

$('btn-discard').addEventListener('click', async () => {
  setDirty(false);
  await views[state.view].render();
});

window.addEventListener('beforeunload', event => {
  if (!state.dirty) return;
  event.preventDefault();
  event.returnValue = '';
});

// The editor's Viewer rewards section links straight to this tab.
show(location.hash === '#perks' ? 'perks' : 'settings');
</script>
<script src="dialogs.js"></script>
<script src="tooltips.js"></script>
</body>
</html>
