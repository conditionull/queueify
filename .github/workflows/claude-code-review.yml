name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Branches pushed to this repository only, never a fork.
    #
    # GitHub does not hand secrets to a workflow triggered by a pull request
    # from a fork, so this could not authenticate there anyway - it would just
    # fail and leave a confusing red cross on somebody's first contribution.
    # Saying so here skips it cleanly, and keeps the token to this repository.
    #
    # Tests and Secret scan still run on fork pull requests: they need no
    # secrets, which is exactly why they were built that way.
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history, so the review can diff against the base branch. At
          # depth 1 there is nothing to compare against.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # A direct instruction rather than the code-review plugin.
          #
          # The plugin ran fine - twenty turns, no permission denials - and
          # posted nothing twice, including on a pull request carrying three
          # deliberate bugs. Its review level is an argument nobody passed, and
          # with none given it reuses the last level typed, which in a fresh
          # container does not exist. Rather than guess at its argument order,
          # this says plainly what to do and points at the repository's own
          # review guide.
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in this repository.

            Read `.github/claude-review.md` first and follow it. It says what
            matters in this codebase, what to ignore, and how to write the reply.
            `CLAUDE.md` has the rules those priorities come from.

            The changes under review are the diff between the base branch and
            this one:

                git diff origin/${{ github.event.pull_request.base.ref }}...HEAD

            Post each finding as an inline comment on the line it applies to,
            with `mcp__github_inline_comment__create_inline_comment`. Name the
            input or state that makes it go wrong - a finding you cannot
            demonstrate is not one. Correctness first; this repository drives a
            live overlay on somebody's stream.

          # Sonnet, not the default Opus. A PR review is not worth Opus, and
          # this draws on the same plan limits as an interactive session.
          # "Extra" in the model picker is the xhigh effort level.
          claude_args: '--model claude-sonnet-5 --effort xhigh --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git log:*),Bash(git show:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

