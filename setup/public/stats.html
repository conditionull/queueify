<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Queueify Stats</title>
<link rel="stylesheet" href="docus.css">
<script src="docus.js"></script>
<style>
  /* The page's own names for things, pointed at the docs site's palette in
     docus.css - light and dark both come from there. */
  :root {
    --bg: var(--ui-bg);
    --surface: var(--ui-bg);
    --surface-2: var(--ui-bg-elevated);
    --line: var(--ui-border-muted);
    --line-soft: var(--ui-border);
    --text: var(--ui-text);
    --muted: var(--ui-text-muted);
    --faint: var(--ui-text-dimmed);
    --accent: var(--ui-primary-strong);
    --accent-soft: color-mix(in srgb, var(--ui-primary) 18%, transparent);
    --green: var(--ui-primary-strong);
    --amber: var(--ui-warning-text);
    --red: var(--ui-error);
    --radius: 8px;
    /* The second colour in a split, beside the green: the docs site's blue */
    --series-2: var(--ui-info);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--ui-primary); text-decoration: none; font-weight: 500; }
  a:hover { text-decoration: underline; }

  /* ------------------------------------------------------------ layout */

  .inner { max-width: 1020px; }

  /* The groups stay under the header while the page scrolls, so moving
     between them never means going back to the top. The fade underneath is
     what lets a card pass behind them without a hard edge. */
  .pillbar {
    position: sticky; top: 64px; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    padding: 0 0 20px; margin-top: -8px;
    background: linear-gradient(var(--bg) 70%, transparent);
  }
  .pills { display: flex; }

  .bar-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }

  /* Each tab's page opens the way a docs page does */
  .page-head {
    padding-bottom: 28px; margin-bottom: 28px;
    border-bottom: 1px solid var(--line-soft);
  }
  .page-head::before {
    content: 'Stats'; display: block; margin-bottom: 8px;
    font-size: 14px; font-weight: 600; color: var(--ui-primary);
  }
  .page-head h1 {
    margin: 0; font-size: 36px; line-height: 1.2; font-weight: 700;
    letter-spacing: -.01em; color: var(--ui-text-highlighted);
  }
  .page-head p { margin: 14px 0 0; color: var(--muted); font-size: 18px; line-height: 1.55; max-width: 62ch; }

  /* A soft grey button, as Nuxt UI draws its neutral one */
  .ghost {
    font: inherit; font-size: 14px; font-weight: 500; line-height: 20px;
    background: var(--surface-2); border: 0;
    color: var(--text); border-radius: 6px;
    padding: 6px 12px; cursor: pointer; flex: none;
    transition: background .15s;
  }
  .ghost:hover { background: var(--ui-bg-accented); color: var(--ui-text-highlighted); }
  .ghost:focus-visible { outline: 2px solid var(--ui-primary); outline-offset: 2px; }

  /* ------------------------------------------------------------- cards */

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 16px;
    overflow: hidden;
  }
  /* Title over subtitle, always. Side by side, one card's note would fit and
     its neighbour's would wrap, and the two headers - and every list row under
     them - would stop lining up across the row. */
  .card > header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line-soft);
    display: flex; flex-direction: column; gap: 2px;
  }
  .card > header h2 { margin: 0; font-size: 16px; font-weight: 600; color: var(--ui-text-highlighted); }
  .card > header .sub { color: var(--faint); font-size: 13px; }
  .card > .body { padding: 16px 18px; }

  /* Every card in a row is as tall as the tallest, so the row ends on one
     line. Cards used to keep their own heights, which left a short card with a
     hole under it beside a long one - so the views put cards of a kind
     together instead: lists with lists, and the one-liners in a card of their
     own (.facts). */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px; align-items: stretch; margin-bottom: 16px;
  }
  .grid .card { margin-bottom: 0; }
  /* Two up rather than three */
  .grid.pair { grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }
  /* Three lists across, or one above the other - never two and a stray,
     which is the hole all over again */
  .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 1180px) { .grid.three { grid-template-columns: minmax(0, 1fr); } }

  /* The far ends: six one-line facts as one card with a ruled grid inside,
     instead of six small cards that never wrap evenly. Three, two or one
     across, all of which divide six. */
  .facts {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1px; background: var(--line-soft);
  }
  .facts .fact { background: var(--surface); padding: 16px 18px; }
  .fact .fact-k { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500; color: var(--ui-primary); }
  .facts-foot {
    padding: 14px 18px; border-top: 1px solid var(--line-soft);
    font-size: 14px; color: var(--muted);
  }
  .facts-foot strong { color: var(--ui-text-highlighted); font-weight: 600; }
  @media (max-width: 1100px) { .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .facts { grid-template-columns: minmax(0, 1fr); } }

  /* --------------------------------------------------------- stat tiles */

  .tiles {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px; margin-bottom: 22px;
  }
  .tile {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 15px 16px;
  }
  .tile .n {
    font-size: 28px; font-weight: 700; letter-spacing: -.02em; color: var(--ui-text-highlighted);
    font-variant-numeric: tabular-nums; line-height: 1.15;
  }
  .tile .k { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .tile .s { font-size: 11.5px; color: var(--faint); margin-top: 5px; }

  /* --------------------------------------------------------- bar charts */

  .bars { display: flex; flex-direction: column; gap: 9px; }
  .bar { display: grid; grid-template-columns: minmax(90px, 30%) 1fr auto; align-items: center; gap: 12px; }
  .bar .lbl { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .track { background: var(--surface-2); border-radius: 999px; height: 8px; overflow: hidden; }
  /* display:block matters: a bare span is inline, and an inline element
     ignores the width and height this is drawn with entirely. */
  .bar .fill {
    display: block; height: 100%; border-radius: 999px;
    background: var(--ui-primary-strong);
  }
  .bar .val { font-size: 12.5px; color: var(--faint); font-variant-numeric: tabular-nums; min-width: 2.5em; text-align: right; }

  /* Hour-of-day: 24 columns, so it reads as a shape rather than a list. */
  .hours { display: flex; align-items: flex-end; gap: 3px; height: 108px; }
  .hours .h { flex: 1; background: var(--surface-2); border-radius: 3px 3px 0 0; position: relative; min-height: 2px; }
  .hours .h.on { background: var(--ui-primary-strong); }
  .hour-axis { display: flex; justify-content: space-between; margin-top: 7px; font-size: 11px; color: var(--faint); }

  .split { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
  .split span { display: block; height: 100%; }
  .legend { display: flex; gap: 16px; margin-top: 11px; font-size: 12.5px; color: var(--muted); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; }

  /* ------------------------------------------------------------- lists */

  .rank { display: flex; flex-direction: column; }
  .rank .row {
    display: grid; grid-template-columns: 22px 1fr auto;
    align-items: baseline; gap: 11px;
    padding: 8px 0; border-bottom: 1px solid var(--line-soft);
  }
  .rank .row:last-child { border-bottom: none; }
  .rank .i { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .rank .name { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank .name small { color: var(--faint); display: block; font-size: 11.5px; }
  .rank .v { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; font-size: 11px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--faint); font-weight: 600;
    padding: 0 10px 9px 0; border-bottom: 1px solid var(--line);
  }
  td { padding: 10px 10px 10px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td.num { font-variant-numeric: tabular-nums; color: var(--muted); }
  .table-wrap { overflow-x: auto; }

  .fact { font-size: 13.5px; }
  .fact strong { display: block; font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .fact span { color: var(--muted); }
  .fact em { display: block; color: var(--faint); font-style: normal; font-size: 12px; margin-top: 5px; }

  .empty { color: var(--muted); font-size: 13.5px; }
  .empty strong { color: var(--text); display: block; margin-bottom: 5px; font-size: 15px; }

  .view { display: none; }
  .view.active { display: block; }

  @media (max-width: 860px) {
    .page-head h1 { font-size: 30px; }
    .page-head p { font-size: 16px; }
    /* The pills need the width once the Refresh button stops fitting beside
       them, so they take the row and it drops underneath. */
    .pillbar { position: static; margin-top: 0; flex-wrap: wrap; }
    .pills { width: 100%; overflow-x: auto; }
    .pills button { flex: 1; }
  }


  /* ------------------------------------------------------------- frame */

  /* The page sits in the frame from docus.css. Its title rule runs out to the
     rails, and the panels under it do too, one straight after another, so the
     page reads as one ruled table under its title instead of cards floating
     in the middle. Each panel's text keeps the page's gutter, so it lines up
     with the title above it. */
  .inner { max-width: none; }
  .page-head {
    margin: 0 calc(-1 * var(--d-gutter));
    padding-inline: var(--d-gutter);
    border-bottom-color: var(--line);
  }
  .view > .card, #view > .card {
    margin: 0 calc(-1 * var(--d-gutter));
    border-width: 0 0 1px; border-radius: 0;
  }
  .card > header { padding-inline: var(--d-gutter); background: color-mix(in srgb, var(--ui-bg-elevated) 35%, transparent); }
  .card > .body { padding-inline: var(--d-gutter); }

  .tiles, .grid {
    gap: 1px; margin: 0 calc(-1 * var(--d-gutter));
    background: var(--line); border-bottom: 1px solid var(--line);
  }
  .tile { border: 0; border-radius: 0; padding: 18px var(--d-gutter); }
  .grid .card { border: 0; border-radius: 0; }
  /* Every panel takes the page's gutter, so whichever panel a row wraps to
     the left edge, its text lines up with the title */
  .grid .card > header, .grid .card > .body { padding-inline: var(--d-gutter); }
  .facts .fact { padding-inline: var(--d-gutter); }
  .facts-foot { padding-inline: var(--d-gutter); }

</style>
</head>
<body>

<q-header></q-header>
<div class="d-shell">
  <aside class="d-aside">
    <q-nav active="stats"></q-nav>
    <div class="d-aside-foot" id="since">Counted from the request log.</div>
  </aside>

  <main class="d-main">
    <div class="inner">
      <div class="pillbar">
        <nav class="pills d-tabs">
          <button class="active" data-view="overview">Overview</button>
          <button data-view="people">People</button>
          <button data-view="music">Music</button>
          <button data-view="streams">Streams</button>
        </nav>
        <div class="bar-actions">
          <button class="ghost" onclick="refresh()">Refresh</button>
        </div>
      </div>

      <div class="view active" id="view-overview"></div>
      <div class="view" id="view-people"></div>
      <div class="view" id="view-music"></div>
      <div class="view" id="view-streams"></div>
    </div>
  </main>
</div>

<script>
/**
 * Queueify's stats page.
 *
 * Read-only: it counts up the request log and shows it. There is nothing to
 * save here, so there is no savebar and no unsaved-changes guard, which is the
 * one way this page departs from admin.html.
 */

const $ = id => document.getElementById(id);

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

async function api(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`${path} answered ${res.status}`);
  return res.json();
}

/* ----------------------------------------------------------- formatting */

function number(value) {
  return Number(value || 0).toLocaleString();
}

function percent(ratio) {
  return `${Math.round((ratio || 0) * 100)}%`;
}

/** Long spans read as hours; a single stream's worth reads as minutes. */
function duration(ms) {
  const totalMinutes = Math.round((ms || 0) / 60000);
  if (totalMinutes < 60) return `${totalMinutes} min`;

  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  if (hours < 48) return minutes ? `${hours}h ${minutes}m` : `${hours}h`;

  return `${Math.floor(hours / 24)}d ${hours % 24}h`;
}

function trackTime(ms) {
  const seconds = Math.round((ms || 0) / 1000);
  return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
}

function date(iso) {
  if (!iso) return '-';
  return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
}

function dateTime(iso) {
  if (!iso) return '-';
  return new Date(iso).toLocaleString(undefined, {
    day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
  });
}

// The outcome names are the ones the log stores, which are the same ones the
// chat messages are keyed on. This is the only place they become English.
const REJECTION_LABELS = {
  cooldown: 'Asked again too soon',
  queueClosed: 'Queue was closed',
  recentlyRequested: 'Song was just played',
  tooLong: 'Song was too long',
  explicit: 'Explicit songs are off',
  blockedArtist: 'Artist is blocked',
  blockedSong: 'Song is blocked',
  invalidUrl: 'Not a Spotify link',
  notFound: 'No such song',
  addFailed: 'Spotify refused it',
  syncFailed: 'Could not reach Spotify',
  requestPending: 'Already had one in flight'
};

function rejectionLabel(outcome) {
  return REJECTION_LABELS[outcome] || outcome;
}

/* -------------------------------------------------------------- pieces */

function card(title, sub, bodyHtml) {
  return `<section class="card">
    <header><h2>${escapeHtml(title)}</h2>${sub ? `<span class="sub">${escapeHtml(sub)}</span>` : ''}</header>
    <div class="body">${bodyHtml}</div>
  </section>`;
}

function tile(n, k, s) {
  return `<div class="tile">
    <div class="n">${escapeHtml(n)}</div>
    <div class="k">${escapeHtml(k)}</div>
    ${s ? `<div class="s">${escapeHtml(s)}</div>` : ''}
  </div>`;
}

/** A ranked list. `rows` are already in order; this only draws them. */
function rankList(rows, name, value, sub) {
  if (!rows || !rows.length) return '<p class="empty">Nothing yet.</p>';

  return `<div class="rank">${rows.map((row, index) => `
    <div class="row">
      <span class="i">${index + 1}</span>
      <span class="name">${escapeHtml(name(row))}${sub && sub(row) ? `<small>${escapeHtml(sub(row))}</small>` : ''}</span>
      <span class="v">${escapeHtml(value(row))}</span>
    </div>`).join('')}</div>`;
}

/** Horizontal bars, scaled against the biggest one rather than the total. */
function barList(rows, label, value) {
  if (!rows || !rows.length) return '<p class="empty">Nothing yet.</p>';

  const max = Math.max(...rows.map(value), 1);

  return `<div class="bars">${rows.map(row => `
    <div class="bar">
      <span class="lbl">${escapeHtml(label(row))}</span>
      <span class="track"><span class="fill" style="width:${(value(row) / max) * 100}%"></span></span>
      <span class="val">${number(value(row))}</span>
    </div>`).join('')}</div>`;
}

/** One cell of the far-ends card: what it is, then the track. */
function fact(label, track, note) {
  const k = `<span class="fact-k">${escapeHtml(label)}</span>`;
  if (!track) return `<div class="fact">${k}<span>Nothing yet.</span></div>`;

  return `<div class="fact">${k}
    <strong>${escapeHtml(track.name)}</strong>
    <span>${escapeHtml(track.artists || '')}</span>
    ${note ? `<em>${escapeHtml(note(track))}</em>` : ''}
  </div>`;
}

function nothingYet(what) {
  return `<div class="card"><div class="body"><p class="empty">
    <strong>Nothing to count yet.</strong>
    ${escapeHtml(what)} Queueify starts keeping a record the first time somebody
    requests a song, so come back after a stream.
  </p></div></div>`;
}

/* --------------------------------------------------------------- views */

async function renderOverview() {
  const data = await api('/api/stats/overview');

  $('since').textContent = data.since
    ? `Counted since ${date(data.since)}.`
    : 'Counted from the request log.';

  if (data.empty) {
    $('view-overview').innerHTML = head('Overview', 'Every song request since Queueify started keeping count.')
      + nothingYet('');
    return;
  }

  const t = data.totals;
  const sources = data.sources.chat + data.sources.redeem;
  const busiest = data.hours.indexOf(Math.max(...data.hours));
  const peak = Math.max(...data.hours, 1);

  const tiles = `<div class="tiles">
    ${tile(number(t.accepted), 'Songs queued', `${percent(data.acceptanceRate)} of requests got in`)}
    ${tile(duration(data.queuedMs), 'Of music', 'Total length of everything queued')}
    ${tile(number(t.viewers), 'People', `${number(t.artists)} different artists`)}
    ${tile(number(t.sessions), 'Streams', t.sessions ? `Counted by gaps of 3h or more` : '')}
  </div>`;

  const whereFrom = card('Where requests come from', `${number(sources)} in total`, `
    <div class="split">
      <span style="width:${(data.sources.chat / Math.max(sources, 1)) * 100}%;background:var(--accent)"></span>
      <span style="width:${(data.sources.redeem / Math.max(sources, 1)) * 100}%;background:var(--series-2)"></span>
    </div>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>Chat &middot; ${number(data.sources.chat)}</span>
      <span><i style="background:var(--series-2)"></i>Channel points &middot; ${number(data.sources.redeem)}</span>
    </div>`);

  // The most useful card on the page: it says which setting is turning people
  // away, so a number that looks wrong can actually be acted on. Worth naming
  // plainly for that reason - this is the one somebody comes here to check.
  const turnedAway = card(
    'Why requests get turned away',
    `${number(t.rejected)} of ${number(t.requests)} never made the queue`,
    data.rejections.length
      ? barList(data.rejections, row => rejectionLabel(row.outcome), row => row.count)
      : '<p class="empty">Every request so far has made it into the queue.</p>');

  const when = card('When people request', `Busiest around ${busiest}:00`, `
    <div class="hours">
      ${data.hours.map((count, hour) => `
        <span class="h ${count ? 'on' : ''}" style="height:${(count / peak) * 100}%"
              title="${hour}:00 - ${number(count)} requests"></span>`).join('')}
    </div>
    <div class="hour-axis"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>23:00</span></div>`);

  const flavour = card('The shape of it', '', `
    <div class="bars">
      ${data.obscurity !== null ? `
      <div class="bar">
        <span class="lbl">Obscurity</span>
        <span class="track"><span class="fill" style="width:${100 - data.obscurity}%"></span></span>
        <span class="val">${Math.round(100 - data.obscurity)}</span>
      </div>` : ''}
      <div class="bar">
        <span class="lbl">Explicit</span>
        <span class="track"><span class="fill" style="width:${(data.explicitRatio || 0) * 100}%"></span></span>
        <span class="val">${percent(data.explicitRatio)}</span>
      </div>
    </div>
    ${data.decades.length ? `<div style="margin-top:16px">${
      barList(data.decades, row => `${row.decade}s`, row => row.count)
    }</div>` : ''}`);

  $('view-overview').innerHTML =
    head('Overview', 'Every song request since Queueify started keeping count.')
    + tiles
    + `<div class="grid">${whereFrom}${turnedAway}</div>`
    + `<div class="grid">${when}${flavour}</div>`;
}

// Both People and Music come from the one leaderboards call, so it is fetched
// once and the two views read from it rather than asking twice.
let boards = null;

async function loadBoards() {
  if (!boards) boards = await api('/api/stats/leaderboards');
  return boards;
}

async function renderPeople() {
  const data = await loadBoards();
  const title = head('People', 'Who asks for what, and whose taste looks like whose.');

  if (data.empty) {
    $('view-people').innerHTML = title + nothingYet('');
    return;
  }

  const requesters = card('Top requesters', 'By songs that got queued',
    rankList(data.topRequesters,
      row => row.name,
      row => number(row.accepted),
      row => (row.aliases.length ? `also seen as ${row.aliases.join(', ')}` : '')));

  const signatures = card('Signature songs', 'The one that is most theirs',
    rankList(data.signatures,
      row => row.viewer,
      row => `${number(row.count)}x`,
      row => `${row.name}${row.exclusive ? ' - nobody else asks for it' : ''}`));

  const twins = card('Closest listening twins', 'By the artists they share',
    rankList(data.twins,
      row => `${row.a} & ${row.b}`,
      row => percent(row.overlap),
      row => `${number(row.shared)} artists in common`));

  const streaks = card('Longest streaks', 'Streams in a row with a request',
    rankList(data.streaks,
      row => row.name,
      row => number(row.longest),
      row => (row.current ? `still going - ${number(row.current)}` : 'ended')));

  // The three lists with a row per viewer run to about the same length, so
  // they share a row. Twins has a row per pair, which is usually far fewer,
  // and stretched beside the others it was mostly empty box - it gets a row
  // of its own instead.
  $('view-people').innerHTML = title
    + `<div class="grid three">${requesters}${signatures}${streaks}</div>`
    + twins;
}

async function renderMusic() {
  const data = await loadBoards();
  const title = head('Music', 'What actually gets played, and the far ends of it.');

  if (data.empty) {
    $('view-music').innerHTML = title + nothingYet('');
    return;
  }

  const tracks = card('Most requested songs', 'Remasters counted as one',
    rankList(data.topTracks,
      row => row.name,
      row => number(row.count),
      row => row.artists));

  const artistBoard = card('Most requested artists', 'A collaboration counts for both',
    rankList(data.topArtists,
      row => row.name,
      row => number(row.count),
      row => `${number(row.tracks)} ${row.tracks === 1 ? 'track' : 'tracks'}`));

  const skipped = card('Most skipped', 'Cut short before it finished',
    rankList(data.mostSkipped,
      row => row.name,
      row => number(row.count),
      row => row.artists));

  // Spotify scores every track 0-100 for how much the world is listening to it
  // right now. These two are the ends of that, and neither title says so on its
  // own, so the header spells it out.
  const popularity = track => `Spotify popularity ${track.popularity} out of 100`;

  const e = data.extremes;
  const facts = `<section class="card">
    <header><h2>The far ends</h2><span class="sub">The extremes of everything that got queued</span></header>
    <div class="facts">
      ${fact('Longest song', e.longest, track => trackTime(track.durationMs))}
      ${fact('Shortest song', e.shortest, track => trackTime(track.durationMs))}
      ${fact('Deepest cut', e.obscurest, popularity)}
      ${fact('Biggest crowd-pleaser', e.mainstream, popularity)}
      ${fact('Oldest', e.oldest, track => track.releaseDate)}
      ${fact('Newest', e.newest, track => track.releaseDate)}
    </div>
    <footer class="facts-foot"><strong>${number(data.oneHitWonders)}</strong>
      ${data.oneHitWonders === 1 ? 'artist has' : 'artists have'} been asked for exactly once, ever.</footer>
  </section>`;

  // Grouped by shape, not by subject: the ranked lists in one row, stretched
  // to the same height, and the one-liners together in a card of their own.
  // Mixed together, a ten-row list next to three-line cards left a hole.
  const lists = [tracks, artistBoard, data.mostSkipped.length ? skipped : ''].join('');
  $('view-music').innerHTML = title
    + `<div class="grid ${data.mostSkipped.length ? 'three' : 'pair'}">${lists}</div>`
    + facts;
}

async function renderStreams() {
  const { sessions } = await api('/api/stats/sessions');

  if (!sessions.length) {
    $('view-streams').innerHTML = head('Streams', 'One row per stream, newest first.') + nothingYet('');
    return;
  }

  const rows = sessions.map(session => `<tr>
    <td>${escapeHtml(dateTime(session.startedAt))}</td>
    <td class="num">${escapeHtml(duration(session.durationMs))}</td>
    <td class="num">${number(session.accepted)}</td>
    <td class="num">${number(session.rejected)}</td>
    <td class="num">${number(session.viewers)}</td>
    <td>${session.firstTrack
      ? `${escapeHtml(session.firstTrack.name || '-')}<br><span style="color:var(--faint);font-size:12px">${escapeHtml(session.firstTrack.artists || '')}</span>`
      : '-'}</td>
    <td>${session.topRequester ? escapeHtml(session.topRequester.name) : '-'}</td>
  </tr>`).join('');

  $('view-streams').innerHTML =
    head('Streams', 'One row per stream, newest first. A gap of three hours or more starts a new one.')
    + card('Every stream', `${number(sessions.length)} counted`, `<div class="table-wrap"><table>
        <thead><tr>
          <th>Started</th><th>Length</th><th>Queued</th><th>Bounced</th>
          <th>People</th><th>First song</th><th>Top requester</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`);
}

function head(title, description) {
  return `<div class="page-head">
    <h1>${escapeHtml(title)}</h1>
    <p>${escapeHtml(description)}</p>
  </div>`;
}

/* -------------------------------------------------------------- routing */

const VIEWS = {
  overview: renderOverview,
  people: renderPeople,
  music: renderMusic,
  streams: renderStreams
};

let currentView = 'overview';

async function show(name, { force = false } = {}) {
  if (!VIEWS[name]) name = 'overview';

  const changed = name !== currentView;
  currentView = name;

  for (const other of Object.keys(VIEWS)) {
    $('view-' + other).classList.toggle('active', other === name);
  }
  for (const button of document.querySelectorAll('.pills button[data-view]')) {
    button.classList.toggle('active', button.dataset.view === name);
  }

  if (location.hash.slice(1) !== name) history.replaceState(null, '', '#' + name);

  // Historical data, so a view is drawn once and then left alone until the
  // Refresh button asks for it again.
  const host = $('view-' + name);
  if (!force && !changed && host.innerHTML) return;
  if (!force && host.innerHTML) return;

  host.innerHTML = '<div class="card"><div class="body"><p class="empty">Counting…</p></div></div>';

  try {
    await VIEWS[name]();
  } catch (err) {
    host.innerHTML = `<div class="card"><div class="body"><p class="empty">
      <strong>Could not read the request log.</strong>${escapeHtml(err.message)}
    </p></div></div>`;
  }
}

function refresh() {
  // People and Music share one response, so a refresh has to drop it or they
  // would redraw the numbers they already had.
  boards = null;
  show(currentView, { force: true });
}

for (const button of document.querySelectorAll('.pills button[data-view]')) {
  button.addEventListener('click', () => show(button.dataset.view));
}

window.addEventListener('hashchange', () => show(location.hash.slice(1)));

show(location.hash.slice(1) || 'overview');
</script>
<script src="/tooltips.js"></script>
